name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove personal paths and file names before posting. For security issues, follow SECURITY.md instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Scan a folder with...\n2. Choose...\n3. Click..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include any error message. If files ended up in an unexpected place, say so here.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mfiles version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
